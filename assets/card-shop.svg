<svg xmlns="http://www.w3.org/2000/svg" width="590" height="280" viewBox="0 0 590 280" role="img" aria-label="Shop by Camera. Photograph or describe anything, find where to buy it, nearby or online. Eight languages, Hebrew and Arabic too.">
<title>Shop by Camera</title>
<defs>
  <linearGradient id="c4bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1020"/><stop offset="1" stop-color="#080912"/></linearGradient>
  <linearGradient id="c4t" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#19e8d6"/><stop offset="1" stop-color="#3aa8ff"/></linearGradient>
  <linearGradient id="c4s" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="590" y2="280"><stop offset="0" stop-color="#19e8d6"/><stop offset="1" stop-color="#3aa8ff"/></linearGradient>
  <radialGradient id="c4o"><stop offset="0" stop-color="#19e8d6" stop-opacity=".55"/><stop offset="1" stop-color="#19e8d6" stop-opacity="0"/></radialGradient>
  <radialGradient id="c4o2"><stop offset="0" stop-color="#3aa8ff" stop-opacity=".5"/><stop offset="1" stop-color="#3aa8ff" stop-opacity="0"/></radialGradient>
  <clipPath id="c4clip"><rect width="590" height="280" rx="22"/></clipPath>
  <filter id="c4bl"><feGaussianBlur stdDeviation="22"/></filter>
</defs>
<style>
  .orb{animation:orb 9s ease-in-out infinite alternate}
  .orb2{animation:orb 12s ease-in-out infinite alternate-reverse}
  @keyframes orb{to{transform:translate(40px,-24px) scale(1.2)}}
  .run{fill:none;stroke:url(#c4s);stroke-width:2.5;stroke-linecap:round;stroke-dasharray:16 84;animation:run 5.5s linear infinite;filter:drop-shadow(0 0 6px #19e8d6)}
  @keyframes run{to{stroke-dashoffset:-100}}
  .rise{animation:up .9s cubic-bezier(.2,1,.3,1) both}
  @keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  .fl{animation:fl 5s ease-in-out infinite alternate}
  @keyframes fl{to{transform:translateY(-8px)}}
  .fl2{animation:fl 6.5s ease-in-out infinite alternate-reverse}
  .pulse{animation:pu 2.2s ease-in-out infinite}
  @keyframes pu{50%{opacity:.35}}
  .spin{animation:sp 14s linear infinite;transform-box:fill-box;transform-origin:center}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
<g clip-path="url(#c4clip)">
  <rect width="590" height="280" fill="url(#c4bg)"/>
  <g filter="url(#c4bl)"><circle class="orb" cx="460.2" cy="84" r="154" fill="url(#c4o)"/><circle class="orb2" cx="118" cy="266" r="126" fill="url(#c4o2)"/></g>
  
  <g transform="translate(452,34)">
    <style>
      .scan{animation:sc 2.8s ease-in-out infinite alternate}
      @keyframes sc{from{transform:translateY(0)}to{transform:translateY(112px)}}
      .chip{opacity:0;animation:ch 6s ease-out infinite}
      @keyframes ch{0%,12%{opacity:0;transform:translateY(12px) scale(.9)}20%,70%{opacity:1;transform:none}82%,100%{opacity:0;transform:translateY(-6px)}}
    </style>
    <rect x="0" y="0" width="108" height="196" rx="20" fill="#0b0d18" stroke="#fff" stroke-opacity=".22" stroke-width="2"/>
    <rect x="8" y="14" width="92" height="168" rx="12" fill="#10132a"/>
    <path d="M24 44 h-8 v8 M84 44 h8 v8 M24 126 h-8 v-8 M84 126 h8 v-8" fill="none" stroke="#19e8d6" stroke-width="3" stroke-linecap="round" transform="translate(0,0)"/>
    <g transform="translate(54,86)" opacity=".85"><rect x="-22" y="-14" width="44" height="30" rx="6" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="2.5"/><path d="M-12 -14 l4 -7 h8 l4 7" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="2.5"/><circle r="8" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="2.5"/></g>
    <g class="scan"><rect x="16" y="44" width="76" height="3" rx="1.5" fill="#19e8d6"/><rect x="16" y="40" width="76" height="10" fill="#19e8d6" opacity=".18"/></g>
    <rect x="34" y="188" width="40" height="4" rx="2" fill="#fff" fill-opacity=".3" transform="translate(0,-14)"/>
    <g class="chip"><g transform="translate(-54,36)"><rect width="104" height="34" rx="17" fill="#0e1124" stroke="#4ff08a" stroke-opacity=".7"/><circle cx="18" cy="17" r="5" fill="#4ff08a"/><text x="30" y="22" font-size="13" font-weight="700" fill="#f4f6ff" font-family="Inter,'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif">2.1 km away</text></g></g>
    <g class="chip" style="animation-delay:2s"><g transform="translate(-62,98)"><rect width="112" height="34" rx="17" fill="#0e1124" stroke="#19e8d6" stroke-opacity=".7"/><circle cx="18" cy="17" r="5" fill="#19e8d6"/><text x="30" y="22" font-size="13" font-weight="700" fill="#f4f6ff" font-family="Inter,'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif">best price</text></g></g>
    <g class="chip" style="animation-delay:4s"><g transform="translate(-34,150)"><rect width="84" height="34" rx="17" fill="#0e1124" stroke="#9b6bff" stroke-opacity=".7"/><circle cx="18" cy="17" r="5" fill="#9b6bff"/><text x="30" y="22" font-size="13" font-weight="700" fill="#f4f6ff" font-family="Inter,'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif">open now</text></g></g>
  </g>
  <g>
    <text x="40" y="44" font-size="12" font-weight="800" letter-spacing="2.4" fill="#19e8d6" font-family="Inter,'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif">MOBILE APP  ·  IN DEVELOPMENT</text>
    <text x="40" y="84" font-size="32" font-weight="800" fill="url(#c4t)" font-family="Inter,'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif">Shop by Camera</text>
    <text x="40" y="112" font-size="16" fill="#8b93b0" font-family="Inter,'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif">Photograph or describe anything,</text><text x="40" y="136" font-size="16" fill="#8b93b0" font-family="Inter,'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif">find where to buy it, nearby or online.</text><text x="40" y="160" font-size="16" fill="#8b93b0" font-family="Inter,'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif">Eight languages, Hebrew and Arabic too.</text>
    <g transform="translate(40,218)"><rect width="63" height="30" rx="15" fill="#fff" fill-opacity=".06" stroke="#fff" stroke-opacity=".12"/><text x="31.5" y="20" text-anchor="middle" font-size="13" font-weight="600" fill="#f4f6ff" font-family="Inter,'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif">React</text></g><g transform="translate(113,218)"><rect width="87.6" height="30" rx="15" fill="#fff" fill-opacity=".06" stroke="#fff" stroke-opacity=".12"/><text x="43.8" y="20" text-anchor="middle" font-size="13" font-weight="600" fill="#f4f6ff" font-family="Inter,'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif">Supabase</text></g><g transform="translate(210.6,218)"><rect width="95.8" height="30" rx="15" fill="#fff" fill-opacity=".06" stroke="#fff" stroke-opacity=".12"/><text x="47.9" y="20" text-anchor="middle" font-size="13" font-weight="600" fill="#f4f6ff" font-family="Inter,'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif">Capacitor</text></g>
  </g>
  <text x="554" y="244" text-anchor="end" font-size="26" font-weight="700" fill="#3aa8ff" font-family="Inter,'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif"></text>
</g>
<rect x=".75" y=".75" width="588.5" height="278.5" rx="21.5" fill="none" stroke="#fff" stroke-opacity=".09"/>
<rect class="run" x="1.25" y="1.25" width="587.5" height="277.5" rx="21" pathLength="100"/>
</svg>