<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-label="IDANK Marketplace. An Israeli marketplace for digital products, built so both sides feel safe: verified sellers, a secure chat for every order, seven days of buyer protection, points, levels and a Discord.">
<title>IDANK Marketplace</title>
<defs>
