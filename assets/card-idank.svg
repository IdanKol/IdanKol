  <linearGradient id="c1t" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#19e8d6"/><stop offset="1" stop-color="#3aa8ff"/></linearGradient>
  <linearGradient id="c1s" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1200" y2="330"><stop offset="0" stop-color="#19e8d6"/><stop offset="1" stop-color="#3aa8ff"/></linearGradient>
  <radialGradient id="c1o"><stop offset="0" stop-color="#19e8d6" stop-opacity=".55"/><stop offset="1" stop-color="#19e8d6" stop-opacity="0"/></radialGradient>
  <radialGradient id="c1o2"><stop offset="0" stop-color="#3aa8ff" stop-opacity=".5"/><stop offset="1" stop-color="#3aa8ff" stop-opacity="0"/></radialGradient>
  <clipPath id="c1clip"><rect width="1200" height="330" rx="22"/></clipPath>
