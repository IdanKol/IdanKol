<svg xmlns="http://www.w3.org/2000/svg" width="590" height="280" viewBox="0 0 590 280" role="img" aria-label="Click of Art. An egg clicker with one million clicks to chase and 5,000 achievements to unlock. Unity, with a beat detector in the mix.">
<title>Click of Art</title>
<defs>
  <linearGradient id="c3bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1020"/><stop offset="1" stop-color="#080912"/></linearGradient>
  <linearGradient id="c3t" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffb347"/><stop offset="1" stop-color="#ff4fd0"/></linearGradient>
  <linearGradient id="c3s" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="590" y2="280"><stop offset="0" stop-color="#ffb347"/><stop offset="1" stop-color="#ff4fd0"/></linearGradient>
  <radialGradient id="c3o"><stop offset="0" stop-color="#ffb347" stop-opacity=".55"/><stop offset="1" stop-color="#ffb347" stop-opacity="0"/></radialGradient>
  <radialGradient id="c3o2"><stop offset="0" stop-color="#ff4fd0" stop-opacity=".5"/><stop offset="1" stop-color="#ff4fd0" stop-opacity="0"/></radialGradient>
  <clipPath id="c3clip"><rect width="590" height="280" rx="22"/></clipPath>
  <filter id="c3bl"><feGaussianBlur stdDeviation="22"/></filter>
</defs>
<style>
  .orb{animation:orb 9s ease-in-out infinite alternate}
  .orb2{animation:orb 12s ease-in-out infinite alternate-reverse}
  @keyframes orb{to{transform:translate(40px,-24px) scale(1.2)}}
  .run{fill:none;stroke:url(#c3s);stroke-width:2.5;stroke-linecap:round;stroke-dasharray:16 84;animation:run 5.5s linear infinite;filter:drop-shadow(0 0 6px #ffb347)}
  @keyframes run{to{stroke-dashoffset:-100}}
  .rise{animation:up .9s cubic-bezier(.2,1,.3,1) both}
  @keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  .fl{animation:fl 5s ease-in-out infinite alternate}
  @keyframes fl{to{transform:translateY(-8px)}}
  .fl2{animation:fl 6.5s ease-in-out infinite alternate-reverse}
  .pulse{animation:pu 2.2s ease-in-out infinite}
  @keyframes pu{50%{opacity:.35}}
  .spin{animation:sp 14s linear infinite;transform-box:fill-box;transform-origin:center}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
<g clip-path="url(#c3clip)">
  <rect width="590" height="280" fill="url(#c3bg)"/>
  <g filter="url(#c3bl)"><circle class="orb" cx="460.2" cy="84" r="154" fill="url(#c3o)"/><circle class="orb2" cx="118" cy="266" r="126" fill="url(#c3o2)"/></g>
  
  <g transform="translate(458,128)">
    <style>
      .egg{transform-box:fill-box;transform-origin:50% 100%;animation:sq 1.6s cubic-bezier(.3,0,.3,1) infinite}
      @keyframes sq{0%,60%,100%{transform:scale(1,1)}68%{transform:scale(1.1,.88)}80%{transform:scale(.95,1.06)}}
      .plus{opacity:0;animation:pl 1.6s ease-out infinite}
      @keyframes pl{0%,62%{opacity:0;transform:translateY(0)}70%{opacity:1}100%{opacity:0;transform:translateY(-52px)}}
      .spk{transform-box:fill-box;transform-origin:center;animation:sk 3s ease-in-out infinite}
      @keyframes sk{0%,100%{transform:scale(.2) rotate(0);opacity:0}50%{transform:scale(1) rotate(90deg);opacity:1}}
    </style>
    <ellipse cx="0" cy="62" rx="58" ry="10" fill="#000" opacity=".35"/>
    <g class="egg">
      <path d="M0 -70 C42 -70 62 -10 62 28 C62 62 34 74 0 74 C-34 74 -62 62 -62 28 C-62 -10 -42 -70 0 -70Z" fill="url(#egg)"/>
      <path d="M-20 -30 L-6 -14 L-18 0 L0 18" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <ellipse cx="-24" cy="-26" rx="10" ry="18" fill="#fff" opacity=".35" transform="rotate(24 -24 -26)"/>
    </g>
    <text class="plus" x="40" y="-60" font-size="24" font-weight="800" fill="#ffb347" font-family="Inter,'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif">+1</text>
    <g class="spk"><path d="M-78 -40l4 10 10 4-10 4-4 10-4-10-10-4 10-4z" fill="#ffb347"/></g>
    <g class="spk" style="animation-delay:-1.2s"><path d="M84 -10l3 8 8 3-8 3-3 8-3-8-8-3 8-3z" fill="#19e8d6"/></g>
    <defs><radialGradient id="egg" cx=".35" cy=".3" r=".9"><stop offset="0" stop-color="#fff3d6"/><stop offset=".55" stop-color="#ffb347"/><stop offset="1" stop-color="#e0562b"/></radialGradient></defs>
  </g>
  <g>
    <text x="40" y="44" font-size="12" font-weight="800" letter-spacing="2.4" fill="#ffb347" font-family="Inter,'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif">GAME  ·  FOR STEAM</text>
    <text x="40" y="84" font-size="32" font-weight="800" fill="url(#c3t)" font-family="Inter,'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif">Click of Art</text>
    <text x="40" y="112" font-size="16" fill="#8b93b0" font-family="Inter,'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif">An egg clicker with one million clicks to</text><text x="40" y="136" font-size="16" fill="#8b93b0" font-family="Inter,'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif">chase and 5,000 achievements to unlock.</text><text x="40" y="160" font-size="16" fill="#8b93b0" font-family="Inter,'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif">Unity, with a beat detector in the mix.</text>
    <g transform="translate(40,218)"><rect width="63" height="30" rx="15" fill="#fff" fill-opacity=".06" stroke="#fff" stroke-opacity=".12"/><text x="31.5" y="20" text-anchor="middle" font-size="13" font-weight="600" fill="#f4f6ff" font-family="Inter,'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif">Unity</text></g><g transform="translate(113,218)"><rect width="38.4" height="30" rx="15" fill="#fff" fill-opacity=".06" stroke="#fff" stroke-opacity=".12"/><text x="19.2" y="20" text-anchor="middle" font-size="13" font-weight="600" fill="#f4f6ff" font-family="Inter,'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif">C#</text></g><g transform="translate(161.4,218)"><rect width="63" height="30" rx="15" fill="#fff" fill-opacity=".06" stroke="#fff" stroke-opacity=".12"/><text x="31.5" y="20" text-anchor="middle" font-size="13" font-weight="600" fill="#f4f6ff" font-family="Inter,'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif">Steam</text></g>
  </g>
  <text x="554" y="244" text-anchor="end" font-size="26" font-weight="700" fill="#ff4fd0" font-family="Inter,'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif"></text>
</g>
<rect x=".75" y=".75" width="588.5" height="278.5" rx="21.5" fill="none" stroke="#fff" stroke-opacity=".09"/>
<rect class="run" x="1.25" y="1.25" width="587.5" height="277.5" rx="21" pathLength="100"/>
</svg>