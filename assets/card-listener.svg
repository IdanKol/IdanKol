ion-duration:1.27s;animation-delay:-1.21s"/><rect class="wv" x="176" y="-40" width="6" height="80" rx="3" style="--m:0.38;animation-duration:1.34s;animation-delay:-0.34s"/><rect class="wv" x="187" y="-40" width="6" height="80" rx="3" style="--m:0.77;animation-duration:0.75s;animation-delay:-1.45s"/><rect class="wv" x="198" y="-40" width="6" height="80" rx="3" style="--m:0.99;animation-duration:1.22s;animation-delay:-0.86s"/><rect class="wv" x="209" y="-40" width="6" height="80" rx="3" style="--m:0.94;animation-duration:1.14s;animation-delay:-0.77s"/><rect class="wv" x="220" y="-40" width="6" height="80" rx="3" style="--m:0.65;animation-duration:1.10s;animation-delay:-0.24s"/><rect class="wv" x="231" y="-40" width="6" height="80" rx="3" style="--m:0.28;animation-duration:0.75s;animation-delay:-0.16s"/></g>
    <g transform="translate(0,66)">
      <text x="0" y="0" font-size="12" font-weight="800" letter-spacing="1.8" fill="#8b93b0" font-family="Inter,'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif">HEARD</text>
      <text class="ty" x="0" y="26" font-size="17" font-weight="700" fill="#f4f6ff" font-family="Inter,'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif">…the words, written out</text>
    </g>
  </g>
  <g>
    <text x="40" y="44" font-size="12" font-weight="800" letter-spacing="2.4" fill="#9b6bff" font-family="Inter,'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif">AI  ·  PROOF OF CONCEPT</text>
    <text x="40" y="84" font-size="32" font-weight="800" fill="url(#c8t)" font-family="Inter,'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif">Lyrics Listener</text>
    <text x="40" y="112" font-size="16" fill="#8b93b0" font-family="Inter,'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif">An AI that listens to the song that is</text><text x="40" y="136" font-size="16" fill="#8b93b0" font-family="Inter,'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif">playing, separates the voice and writes</text><text x="40" y="160" font-size="16" fill="#8b93b0" font-family="Inter,'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif">out the lyrics it hears.</text>
