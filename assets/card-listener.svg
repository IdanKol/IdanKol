      .ty{clip-path:inset(0 100% 0 0);animation:ty 7s steps(23) infinite}
      @keyframes ty{0%{clip-path:inset(0 100% 0 0)}60%,100%{clip-path:inset(0 0 0 0)}}
    </style>
