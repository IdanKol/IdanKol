<svg xmlns="http://www.w3.org/2000/svg" width="590" height="280" viewBox="0 0 590 280" role="img" aria-label="Discord Bots. Server builds and bots: roles, levels, leaderboards, tickets, announcements and live site-to-Discord sync.">
<title>Discord Bots</title>
<defs>
  <linearGradient id="c8bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1020"/><stop offset="1" stop-color="#080912"/></linearGradient>
  <linearGradient id="c8t" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7c85ff"/><stop offset="1" stop-color="#19e8d6"/></linearGradient>
  <linearGradient id="c8s" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="590" y2="280"><stop offset="0" stop-color="#7c85ff"/><stop offset="1" stop-color="#19e8d6"/></linearGradient>
  <radialGradient id="c8o"><stop offset="0" stop-color="#7c85ff" stop-opacity=".55"/><stop offset="1" stop-color="#7c85ff" stop-opacity="0"/></radialGradient>
  <radialGradient id="c8o2"><stop offset="0" stop-color="#19e8d6" stop-opacity=".5"/><stop offset="1" stop-color="#19e8d6" stop-opacity="0"/></radialGradient>
  <clipPath id="c8clip"><rect width="590" height="280" rx="22"/></clipPath>
  <filter id="c8bl"><feGaussianBlur stdDeviation="22"/></filter>
</defs>
<style>
  .orb{animation:orb 9s ease-in-out infinite alternate}
  .orb2{animation:orb 12s ease-in-out infinite alternate-reverse}
  @keyframes orb{to{transform:translate(40px,-24px) scale(1.2)}}
  .run{fill:none;stroke:url(#c8s);stroke-width:2.5;stroke-linecap:round;stroke-dasharray:16 84;animation:run 5.5s linear infinite;filter:drop-shadow(0 0 6px #7c85ff)}
  @keyframes run{to{stroke-dashoffset:-100}}
  .rise{animation:up .9s cubic-bezier(.2,1,.3,1) both}
  @keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  .fl{animation:fl 5s ease-in-out infinite alternate}
  @keyframes fl{to{transform:translateY(-8px)}}
  .fl2{animation:fl 6.5s ease-in-out infinite alternate-reverse}
  .pulse{animation:pu 2.2s ease-in-out infinite}
  @keyframes pu{50%{opacity:.35}}
  .spin{animation:sp 14s linear infinite;transform-box:fill-box;transform-origin:center}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
<g clip-path="url(#c8clip)">
  <rect width="590" height="280" fill="url(#c8bg)"/>
  <g filter="url(#c8bl)"><circle class="orb" cx="460.2" cy="84" r="154" fill="url(#c8o)"/><circle class="orb2" cx="118" cy="266" r="126" fill="url(#c8o2)"/></g>
  
  <g transform="translate(352,58)">
    <style>@keyframes msg{0%{opacity:0;transform:translateY(14px)}8%,70%{opacity:1;transform:none}85%,100%{opacity:0}}</style>
    <rect x="-14" y="-14" width="236" height="176" rx="16" fill="#0c0e1a" stroke="#fff" stroke-opacity=".12"/>
    <g style="opacity:0;animation:msg 8s ease-out infinite;animation-delay:0s"><g transform="translate(0,0)"><circle cx="16" cy="16" r="16" fill="#5865f2"/><text x="46" y="14" font-size="13" font-weight="800" fill="#f4f6ff" font-family="Inter,'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif">IDANK Bot</text><rect x="119.8" y="3" width="30" height="14" rx="3" fill="#5865f2"/><text x="134.8" y="14" text-anchor="middle" font-size="9" font-weight="800" fill="#fff" font-family="Inter,'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif">APP</text><text x="46" y="36" font-size="13" fill="#8b93b0" font-family="Inter,'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif">📈 Level table updated</text></g></g>
    <g style="opacity:0;animation:msg 8s ease-out infinite;animation-delay:1.2s"><g transform="translate(0,54)"><circle cx="16" cy="16" r="16" fill="#4ff08a"/><text x="46" y="14" font-size="13" font-weight="800" fill="#f4f6ff" font-family="Inter,'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif">Statusong</text><rect x="119.8" y="3" width="30" height="14" rx="3" fill="#5865f2"/><text x="134.8" y="14" text-anchor="middle" font-size="9" font-weight="800" fill="#fff" font-family="Inter,'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif">APP</text><text x="46" y="36" font-size="13" fill="#8b93b0" font-family="Inter,'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif">🎵 hold the night a little…</text></g></g>
    <g style="opacity:0;animation:msg 8s ease-out infinite;animation-delay:2.4s"><g transform="translate(0,108)"><circle cx="16" cy="16" r="16" fill="#ff4fd0"/><text x="46" y="14" font-size="13" font-weight="800" fill="#f4f6ff" font-family="Inter,'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif">Welcome</text><rect x="103.39999999999999" y="3" width="30" height="14" rx="3" fill="#5865f2"/><text x="118.39999999999999" y="14" text-anchor="middle" font-size="9" font-weight="800" fill="#fff" font-family="Inter,'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif">APP</text><text x="46" y="36" font-size="13" fill="#8b93b0" font-family="Inter,'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif">🎉 new member just joined</text></g></g>
  </g>
  <g>
    <text x="40" y="44" font-size="12" font-weight="800" letter-spacing="2.4" fill="#7c85ff" font-family="Inter,'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif">COMMUNITY  ·  AUTOMATION</text>
    <text x="40" y="84" font-size="32" font-weight="800" fill="url(#c8t)" font-family="Inter,'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif">Discord Bots</text>
    <text x="40" y="112" font-size="16" fill="#8b93b0" font-family="Inter,'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif">Server builds and bots: roles, levels,</text><text x="40" y="136" font-size="16" fill="#8b93b0" font-family="Inter,'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif">leaderboards, tickets, announcements</text><text x="40" y="160" font-size="16" fill="#8b93b0" font-family="Inter,'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif">and live site-to-Discord sync.</text>
    <g transform="translate(40,218)"><rect width="112.19999999999999" height="30" rx="15" fill="#fff" fill-opacity=".06" stroke="#fff" stroke-opacity=".12"/><text x="56.099999999999994" y="20" text-anchor="middle" font-size="13" font-weight="600" fill="#f4f6ff" font-family="Inter,'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif">Discord API</text></g><g transform="translate(162.2,218)"><rect width="79.39999999999999" height="30" rx="15" fill="#fff" fill-opacity=".06" stroke="#fff" stroke-opacity=".12"/><text x="39.699999999999996" y="20" text-anchor="middle" font-size="13" font-weight="600" fill="#f4f6ff" font-family="Inter,'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif">Node.js</text></g><g transform="translate(251.59999999999997,218)"><rect width="87.6" height="30" rx="15" fill="#fff" fill-opacity=".06" stroke="#fff" stroke-opacity=".12"/><text x="43.8" y="20" text-anchor="middle" font-size="13" font-weight="600" fill="#f4f6ff" font-family="Inter,'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif">Webhooks</text></g>
  </g>
  <text x="554" y="244" text-anchor="end" font-size="26" font-weight="700" fill="#19e8d6" font-family="Inter,'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif"></text>
</g>
<rect x=".75" y=".75" width="588.5" height="278.5" rx="21.5" fill="none" stroke="#fff" stroke-opacity=".09"/>
<rect class="run" x="1.25" y="1.25" width="587.5" height="277.5" rx="21" pathLength="100"/>
</svg>