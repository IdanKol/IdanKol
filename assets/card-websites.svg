      <g opacity=".7"><rect x="16" y="36" width="90" height="10" rx="3" fill="#555a70"/><rect x="16" y="54" width="140" height="6" rx="3" fill="#3a3e52"/><rect x="16" y="66" width="120" height="6" rx="3" fill="#3a3e52"/><rect x="16" y="86" width="168" height="48" rx="4" fill="#2a2d3f"/></g>
      <g clip-path="url(#wsa)">
        <rect y="22" width="200" height="128" fill="#0b0d18"/>
        <rect y="22" width="200" height="74" fill="url(#wsg)"/>
        <rect x="16" y="40" width="110" height="12" rx="6" fill="#fff"/>
        <rect x="16" y="60" width="150" height="6" rx="3" fill="#fff" fill-opacity=".7"/>
        <rect x="16" y="76" width="64" height="16" rx="8" fill="#22e5ff"/>
        <rect x="16" y="106" width="52" height="30" rx="7" fill="#1b1f33"/><rect x="74" y="106" width="52" height="30" rx="7" fill="#1b1f33"/><rect x="132" y="106" width="52" height="30" rx="7" fill="#1b1f33"/>
        <rect x="16" y="106" width="52" height="4" rx="2" fill="#9ae6ff"/><rect x="74" y="106" width="52" height="4" rx="2" fill="#7be9ff"/><rect x="132" y="106" width="52" height="4" rx="2" fill="#b6f0ff"/>
      </g>
    </g>
    <defs><linearGradient id="wsg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6b3cff"/><stop offset="1" stop-color="#ff4fd0"/></linearGradient></defs>
    <text x="100" y="176" text-anchor="middle" font-size="12" font-weight="800" letter-spacing="2" fill="#86a3b8" font-family="Inter,'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif">BEFORE  →  AFTER</text>
  </g>
  <g>
    <text x="40" y="44" font-size="12" font-weight="800" letter-spacing="2.4" fill="#b6f0ff" font-family="Inter,'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif">CLIENT WORK  ·  SMALL BUSINESS</text>
    <text x="40" y="84" font-size="32" font-weight="800" fill="url(#c2t)" font-family="Inter,'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif">Websites for People</text>
    <text x="40" y="112" font-size="16" fill="#86a3b8" font-family="Inter,'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif">Fast, good-looking sites for real businesses:</text><text x="40" y="136" font-size="16" fill="#86a3b8" font-family="Inter,'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif">contractors, barbers, restaurants. Hebrew first,</text><text x="40" y="160" font-size="16" fill="#86a3b8" font-family="Inter,'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif">built to be found on Google.</text>
    <g transform="translate(40,218)"><rect width="104" height="30" rx="15" fill="#fff" fill-opacity=".06" stroke="#fff" stroke-opacity=".12"/><text x="52" y="20" text-anchor="middle" font-size="13" font-weight="600" fill="#f2fbff" font-family="Inter,'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif">HTML + CSS</text></g><g transform="translate(154,218)"><rect width="46.599999999999994" height="30" rx="15" fill="#fff" fill-opacity=".06" stroke="#fff" stroke-opacity=".12"/><text x="23.299999999999997" y="20" text-anchor="middle" font-size="13" font-weight="600" fill="#f2fbff" font-family="Inter,'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif">SEO</text></g><g transform="translate(210.6,218)"><rect width="63" height="30" rx="15" fill="#fff" fill-opacity=".06" stroke="#fff" stroke-opacity=".12"/><text x="31.5" y="20" text-anchor="middle" font-size="13" font-weight="600" fill="#f2fbff" font-family="Inter,'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif">Video</text></g><g transform="translate(283.6,218)"><rect width="104" height="30" rx="15" fill="#fff" fill-opacity=".06" stroke="#fff" stroke-opacity=".12"/><text x="52" y="20" text-anchor="middle" font-size="13" font-weight="600" fill="#f2fbff" font-family="Inter,'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif">Accessible</text></g>
  </g>
  <text x="554" y="244" text-anchor="end" font-size="26" font-weight="700" fill="#22e5ff" font-family="Inter,'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif"></text>
</g>
<rect x=".75" y=".75" width="588.5" height="278.5" rx="21.5" fill="none" stroke="#fff" stroke-opacity=".09"/>
<rect class="run" x="1.25" y="1.25" width="587.5" height="277.5" rx="21" pathLength="100"/>
