    <rect width="200" height="150" rx="12" fill="#0b0d18" stroke="#fff" stroke-opacity=".22" stroke-width="1.5"/>
    <g clip-path="url(#wsc)">
      <rect width="200" height="150" fill="#1a1c28"/>
      <rect y="0" width="200" height="22" fill="#0f111b"/>
