<svg xmlns="http://www.w3.org/2000/svg" width="590" height="280" viewBox="0 0 590 280" role="img" aria-label="Websites for People. Fast, good-looking sites for real businesses: contractors, barbers, restaurants. Hebrew first, built to be found on Google.">
<title>Websites for People</title>
<defs>
  <linearGradient id="c2bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1020"/><stop offset="1" stop-color="#080912"/></linearGradient>
  <linearGradient id="c2t" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b6f0ff"/><stop offset="1" stop-color="#22e5ff"/></linearGradient>
  <linearGradient id="c2s" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="590" y2="280"><stop offset="0" stop-color="#b6f0ff"/><stop offset="1" stop-color="#22e5ff"/></linearGradient>
  <radialGradient id="c2o"><stop offset="0" stop-color="#b6f0ff" stop-opacity=".55"/><stop offset="1" stop-color="#b6f0ff" stop-opacity="0"/></radialGradient>
  <radialGradient id="c2o2"><stop offset="0" stop-color="#22e5ff" stop-opacity=".5"/><stop offset="1" stop-color="#22e5ff" stop-opacity="0"/></radialGradient>
  <clipPath id="c2clip"><rect width="590" height="280" rx="22"/></clipPath>
  <filter id="c2bl"><feGaussianBlur stdDeviation="22"/></filter>
</defs>
<style>
  .orb{animation:orb 9s ease-in-out infinite alternate}
  .orb2{animation:orb 12s ease-in-out infinite alternate-reverse}
  @keyframes orb{to{transform:translate(40px,-24px) scale(1.2)}}
  .run{fill:none;stroke:url(#c2s);stroke-width:2.5;stroke-linecap:round;stroke-dasharray:16 84;animation:run 5.5s linear infinite;filter:drop-shadow(0 0 6px #b6f0ff)}
  @keyframes run{to{stroke-dashoffset:-100}}
  .rise{animation:up .9s cubic-bezier(.2,1,.3,1) both}
  @keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  .fl{animation:fl 5s ease-in-out infinite alternate}
  @keyframes fl{to{transform:translateY(-8px)}}
  .fl2{animation:fl 6.5s ease-in-out infinite alternate-reverse}
  .pulse{animation:pu 2.2s ease-in-out infinite}
  @keyframes pu{50%{opacity:.35}}
  .spin{animation:sp 14s linear infinite;transform-box:fill-box;transform-origin:center}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
<g clip-path="url(#c2clip)">
  <rect width="590" height="280" fill="url(#c2bg)"/>
  <g filter="url(#c2bl)"><circle class="orb" cx="460.2" cy="84" r="154" fill="url(#c2o)"/><circle class="orb2" cx="118" cy="266" r="126" fill="url(#c2o2)"/></g>
  
  <g transform="translate(388,62) scale(.88)">
    <clipPath id="wsc"><rect width="200" height="150" rx="12"/></clipPath>
