<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="Idan Kol. Builder. Apps, AI, side projects that ship.">
  <title>Idan Kol</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060a14"/><stop offset="1" stop-color="#0d1a36"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset=".5" stop-color="#22d3ee" stop-opacity=".55"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#22d3ee" stroke-opacity=".08" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect width="900" height="300" rx="18"/></clipPath>
  </defs>

  <style>
    text { font-family: ui-monospace, "SF Mono", Menlo, Consolas, "Courier New", monospace; }
    .grid   { animation: drift 6s linear infinite; }
    .beam   { animation: sweep 4.2s cubic-bezier(.5,0,.5,1) infinite; }
    .corner { animation: pulse 2.4s ease-in-out infinite; }
    .title  { transform-box: fill-box; transform-origin: center; animation: boom .7s cubic-bezier(.2,1.6,.4,1) both, fade 9s ease-in-out .7s infinite; }
    .g1     { animation: glitch1 3.4s steps(1) infinite; }
    .g2     { animation: glitch2 3.4s steps(1) infinite; }
    .ring   { transform-box: fill-box; transform-origin: center; animation: ring 1s ease-out .35s both; }
    .tag    { opacity: 0; animation: cycle 12s ease-in-out infinite; }
    .t2 { animation-delay: 4s; } .t3 { animation-delay: 8s; }
    .caret  { animation: blink 1s steps(1) infinite; }
    .spark  { animation: rise 5s linear infinite; }

    @keyframes drift  { to { transform: translate(30px, 30px); } }
    @keyframes sweep  { from { transform: translateX(-260px); } to { transform: translateX(900px); } }
    @keyframes pulse  { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
    @keyframes boom   { from { opacity: 0; transform: scale(2.4); } to { opacity: 1; transform: scale(1); } }
    @keyframes fade   { 0%,78% { opacity: 1; } 92% { opacity: .55; } 100% { opacity: 1; } }
    @keyframes glitch1{ 0%,92%,100% { transform: translate(0,0); opacity: 0; } 93% { transform: translate(-5px,2px); opacity: .8; } 96% { transform: translate(4px,-2px); opacity: .8; } 98% { transform: translate(-2px,0); opacity: .8; } }
    @keyframes glitch2{ 0%,92%,100% { transform: translate(0,0); opacity: 0; } 94% { transform: translate(5px,-2px); opacity: .8; } 97% { transform: translate(-4px,2px); opacity: .8; } 99% { transform: translate(2px,0); opacity: .8; } }
    @keyframes ring   { from { opacity: .9; transform: scale(.2); } to { opacity: 0; transform: scale(2.6); } }
    @keyframes cycle  { 0% { opacity: 0; transform: translateY(8px); } 4%,28% { opacity: 1; transform: translateY(0); } 33%,100% { opacity: 0; transform: translateY(-8px); } }
    @keyframes blink  { 50% { opacity: 0; } }
    @keyframes rise   { from { transform: translateY(0); opacity: 0; } 10% { opacity: .9; } to { transform: translateY(-320px); opacity: 0; } }

    @media (prefers-reduced-motion: reduce) {
      .grid,.beam,.corner,.title,.g1,.g2,.ring,.caret,.spark { animation: none; }
      .g1,.g2,.ring,.beam,.spark { opacity: 0; }
      .tag { animation: none; opacity: 0; } .t1 { opacity: 1; }
    }
  </style>

  <g clip-path="url(#frame)">
    <rect width="900" height="300" fill="url(#bg)"/>
    <g class="grid"><rect x="-30" y="-30" width="960" height="360" fill="url(#grid)"/></g>

    <!-- floating sparks -->
    <g fill="#22d3ee">
      <circle class="spark" cx="90"  cy="300" r="2"   style="animation-delay:0s"/>
      <circle class="spark" cx="210" cy="300" r="1.5" style="animation-delay:1.2s"/>
      <circle class="spark" cx="340" cy="300" r="2.5" style="animation-delay:2.4s"/>
      <circle class="spark" cx="520" cy="300" r="1.5" style="animation-delay:.6s"/>
      <circle class="spark" cx="660" cy="300" r="2"   style="animation-delay:3.1s"/>
      <circle class="spark" cx="790" cy="300" r="2.5" style="animation-delay:1.8s"/>
    </g>

    <!-- shockwave from the boom -->
    <circle class="ring" cx="450" cy="118" r="90" fill="none" stroke="#22d3ee" stroke-width="3"/>

    <!-- title with chromatic glitch -->
    <g text-anchor="middle" font-weight="800" font-size="76" letter-spacing="6">
      <text class="g1" x="450" y="142" fill="#ff3ea5">IDAN KOL</text>
      <text class="g2" x="450" y="142" fill="#7c5cff">IDAN KOL</text>
      <text class="title" x="450" y="142" fill="#e6fbff" filter="url(#glow)">IDAN <tspan fill="#22d3ee">KOL</tspan></text>
    </g>

    <!-- rotating taglines -->
    <g text-anchor="middle" font-size="22" fill="#9fdcf0">
      <text class="tag t1" x="450" y="205">&gt; builds apps that solve real problems<tspan class="caret" fill="#22d3ee">_</tspan></text>
      <text class="tag t2" x="450" y="205">&gt; point the camera. find where to buy it<tspan class="caret" fill="#22d3ee">_</tspan></text>
      <text class="tag t3" x="450" y="205">&gt; side projects that actually ship<tspan class="caret" fill="#22d3ee">_</tspan></text>
    </g>

    <!-- scanning beam -->
    <rect class="beam" x="0" y="0" width="260" height="300" fill="url(#beam)"/>

    <!-- viewfinder corners -->
    <g class="corner" fill="none" stroke="#22d3ee" stroke-width="3" stroke-linecap="round">
      <path d="M28 64V30a2 2 0 0 1 2-2h34"/>
      <path d="M872 64V30a2 2 0 0 0-2-2h-34"/>
      <path d="M28 236v34a2 2 0 0 0 2 2h34"/>
      <path d="M872 236v34a2 2 0 0 1-2 2h-34"/>
    </g>
  </g>
  <rect x=".5" y=".5" width="899" height="299" rx="17.5" fill="none" stroke="#22d3ee" stroke-opacity=".25"/>
</svg>
